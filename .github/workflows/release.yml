name: Signed draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PANELGROVE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure signing secrets before creating a release tag.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/panelgrove.jks"
      - name: Build signed APK
        env:
          PANELGROVE_KEYSTORE: ${{ runner.temp }}/panelgrove.jks
          PANELGROVE_STORE_PASSWORD: ${{ secrets.PANELGROVE_STORE_PASSWORD }}
          PANELGROVE_KEY_ALIAS: ${{ secrets.PANELGROVE_KEY_ALIAS }}
          PANELGROVE_KEY_PASSWORD: ${{ secrets.PANELGROVE_KEY_PASSWORD }}
        run: bash gradlew :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify signature and package
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk release/panelgrove-${GITHUB_REF_NAME}.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/*.apk > release/SIGNING-CERTIFICATE.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 release/*.apk
          python scripts/check_apk.py release/*.apk
          (cd release && sha256sum *.apk > SHA256SUMS)
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --generate-notes --title "Panelgrove $GITHUB_REF_NAME"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/panelgrove.jks"
